<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>掌柜智库 - 智能问答</title>
    <!-- Markdown 渲染：marked 负责 MD→HTML，DOMPurify 负责 XSS 清洗；
         两者加载失败时 renderMarkdown() 会自动降级为「转义文本 + 图片还原」 -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f5; height: 100vh; display: flex; flex-direction: column; }
        .header { background: #1a73e8; color: white; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        .header h1 { font-size: 18px; font-weight: 500; }
        .header-actions button { background: rgba(255,255,255,0.2); border: none; color: white; padding: 6px 14px; border-radius: 4px; cursor: pointer; font-size: 13px; }
        .header-actions button:hover { background: rgba(255,255,255,0.3); }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px 24px; }
        .message { max-width: 80%; margin-bottom: 16px; padding: 12px 16px; border-radius: 12px; line-height: 1.6; font-size: 14px; white-space: pre-wrap; word-break: break-word; }
        .message.user { background: #1a73e8; color: white; margin-left: auto; border-bottom-right-radius: 4px; }
        .message.assistant { background: white; color: #333; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
        /* Markdown 渲染后的气泡：改用 normal 让 <p>/<br> 控制排版，避免 pre-wrap 产生双倍空行 */
        .message.rendered { white-space: normal; }
        .message.rendered p { margin: 0.4em 0; }
        .message.rendered p:first-child { margin-top: 0; }
        .message.rendered p:last-child { margin-bottom: 0; }
        .message.rendered img { max-width: 100%; height: auto; border-radius: 8px; margin: 8px 0; display: block; }
        .message.rendered ul, .message.rendered ol { padding-left: 1.5em; margin: 0.4em 0; }
        .message.rendered pre { background: #f6f8fa; padding: 10px; border-radius: 6px; overflow-x: auto; margin: 0.4em 0; }
        .message.rendered code { background: #f0f0f0; padding: 1px 4px; border-radius: 3px; font-size: 13px; }
        .message.rendered pre code { background: none; padding: 0; }
        .message.rendered a { color: #1a73e8; }
        .message.rendered table { border-collapse: collapse; margin: 0.4em 0; }
        .message.rendered th, .message.rendered td { border: 1px solid #ddd; padding: 4px 8px; }
        .progress-bar { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .progress-tag { font-size: 11px; padding: 2px 8px; border-radius: 10px; background: #e8f0fe; color: #1a73e8; }
        .progress-tag.done { background: #e6f4ea; color: #137333; }
        .progress-tag.running { background: #fef7e0; color: #b06000; animation: pulse 1.2s infinite; }
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        .input-area { padding: 16px 24px; background: white; border-top: 1px solid #e0e0e0; display: flex; gap: 12px; align-items: center; }
        .input-area input { flex: 1; padding: 10px 16px; border: 1px solid #ddd; border-radius: 24px; font-size: 14px; outline: none; }
        .input-area input:focus { border-color: #1a73e8; }
        .input-area button { background: #1a73e8; color: white; border: none; padding: 10px 20px; border-radius: 24px; cursor: pointer; font-size: 14px; }
        .input-area button:disabled { background: #ccc; cursor: not-allowed; }
        .mode-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; color: #666; }
        .mode-toggle input { width: auto; }
    </style>
</head>
<body>
    <div class="header">
        <h1>掌柜智库 - 智能问答</h1>
        <div class="header-actions">
            <button onclick="clearHistory()">清空历史</button>
        </div>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-area">
        <label class="mode-toggle">
            <input type="checkbox" id="streamToggle" checked> 流式
        </label>
        <input type="text" id="queryInput" placeholder="输入您的问题..." onkeydown="if(event.key==='Enter')sendMessage()">
        <button id="sendBtn" onclick="sendMessage()">发送</button>
    </div>

    <script>
        const API_BASE = window.location.origin;

        // Session ID 管理：页面加载时生成一次，存 localStorage
        let sessionId = localStorage.getItem('kb_session_id');
        if (!sessionId) {
            sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
            localStorage.setItem('kb_session_id', sessionId);
        }

        const chatContainer = document.getElementById('chatContainer');
        const queryInput = document.getElementById('queryInput');
        const sendBtn = document.getElementById('sendBtn');
        const streamToggle = document.getElementById('streamToggle');

        // 页面加载时恢复历史
        loadHistory();

        // ── Markdown 链接地址修复 ──────────────────────────────────────
        // 知识库图片 URL 由文档标题拼成，常含空格与括号，例如：
        //   .../华为擎云 L540 用户指南-(KLVV,UOS&KOS_01,zh-cn)/xxx.jpg
        // CommonMark 规定链接地址不能出现未转义空白，marked 的 href 规则一碰到空格
        // 就匹配失败，于是把 ![alt](url) 整段当普通正文输出，图片就消失了。
        // 这里按「括号配对」扫描出完整地址再做百分号编码，兼容已入库的历史数据。
        const LINK_HEAD = /!?\[[^\]\n]*\]\(/g;

        function findUrlEnd(text, start) {
            // 从 '(' 之后扫描到与之配对的 ')'，返回 ')' 的下标；跨行或找不到返回 -1
            let depth = 1;
            for (let i = start; i < text.length; i++) {
                const ch = text[i];
                if (ch === '\\') { i++; continue; }   // 跳过转义字符
                if (ch === '\n') return -1;           // 地址不跨行
                if (ch === '(') depth++;
                else if (ch === ')') {
                    depth--;
                    if (depth === 0) return i;
                }
            }
            return -1;
        }

        function encodeUrl(url) {
            // 拆出尾部可选标题：![alt](url "标题")，标题部分不参与编码
            const titleMatch = url.match(/\s+("[^"]*"|'[^']*')$/);
            const title = titleMatch ? titleMatch[0] : '';
            const target = titleMatch ? url.slice(0, titleMatch.index) : url;

            let encoded = '';
            for (const ch of target) {
                encoded += encodeUrlChar(ch);
            }
            return encoded + title;
        }

        function encodeUrlChar(ch) {
            // 括号属于 encodeURIComponent 的「不转义保留字」（! ~ * ' ( ) 同），
            // 但它会提前截断 Markdown 链接，必须手动补上百分号编码
            if (ch === '(') return '%28';
            if (ch === ')') return '%29';
            // 其余只编码会破坏 MD 解析或 HTTP 请求的字符：空白、尖括号、引号、非 ASCII。
            // '%' 本身是 ASCII 且不在集合内，已编码过的 %20 不会被二次编码。
            return (/[\s<>"']/.test(ch) || ch.charCodeAt(0) > 127)
                ? encodeURIComponent(ch)
                : ch;
        }

        function normalizeLinkUrls(text) {
            if (!text || text.indexOf('](') === -1) return text;

            let result = '';
            let cursor = 0;
            let changed = false;
            let match;

            LINK_HEAD.lastIndex = 0;
            while ((match = LINK_HEAD.exec(text)) !== null) {
                const urlStart = match.index + match[0].length;
                const urlEnd = findUrlEnd(text, urlStart);
                if (urlEnd === -1) continue;

                const rawUrl = text.slice(urlStart, urlEnd);
                const encoded = encodeUrl(rawUrl);
                LINK_HEAD.lastIndex = urlEnd + 1;   // 跳过刚处理完的 ')'
                if (encoded === rawUrl) continue;   // 地址本来就合法

                result += text.slice(cursor, urlStart) + encoded;
                cursor = urlEnd;
                changed = true;
            }
            return changed ? result + text.slice(cursor) : text;
        }

        // Markdown 渲染：marked 优先，失败则降级为「HTML 转义 + 图片语法还原」
        // 无论走哪条路径图片都能显示，区别只在排版精细度
        function renderMarkdown(text) {
            if (!text) return '';
            // 先修复非法链接地址，否则 marked 与降级正则都认不出图片语法
            const normalized = normalizeLinkUrls(text);
            try {
                if (window.marked) {
                    const raw = window.marked.parse ? window.marked.parse(normalized) : window.marked(normalized);
                    return window.DOMPurify ? window.DOMPurify.sanitize(raw) : raw;
                }
            } catch (e) {
                console.warn('Markdown 渲染失败，降级处理:', e);
            }
            // 降级：先整体转义防 XSS，再把图片语法还原成 <img>，换行转 <br>
            return normalized
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+["'][^"']*["'])?\)/g, '<img src="$2" alt="$1">')
                .replace(/\n/g, '<br>');
        }

        function appendMessage(role, text) {
            const div = document.createElement('div');
            div.className = `message ${role}`;
            // 助手消息且有内容（历史回放）→ 渲染 Markdown；
            // 用户消息 / 空占位（流式起始）→ 纯文本，避免流式过程中半截语法闪烁
            if (role === 'assistant' && text) {
                div.innerHTML = renderMarkdown(text);
                div.classList.add('rendered');
            } else {
                div.textContent = text;
            }
            chatContainer.appendChild(div);
            scrollToBottom();
            return div;
        }

        function appendProgressContainer(botMsgEl) {
            const bar = document.createElement('div');
            bar.className = 'progress-bar';
            botMsgEl.prepend(bar);
            return bar;
        }

        function renderProgress(barEl, doneList, runningList, status) {
            barEl.innerHTML = '';
            (doneList || []).forEach(name => {
                const tag = document.createElement('span');
                tag.className = 'progress-tag done';
                tag.textContent = name;
                barEl.appendChild(tag);
            });
            (runningList || []).forEach(name => {
                const tag = document.createElement('span');
                tag.className = 'progress-tag running';
                tag.textContent = name;
                barEl.appendChild(tag);
            });
            if (status === 'completed') {
                setTimeout(() => barEl.remove(), 2000);
            }
        }

        function scrollToBottom() {
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        async function sendMessage() {
            const query = queryInput.value.trim();
            if (!query) return;

            queryInput.value = '';
            sendBtn.disabled = true;

            // 显示用户消息
            appendMessage('user', query);

            // 显示助手消息占位
            const botMsgEl = appendMessage('assistant', '');
            const isStream = streamToggle.checked;

            try {
                const resp = await fetch(`${API_BASE}/query`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, session_id: sessionId, is_stream: isStream })
                });
                const data = await resp.json();

                if (isStream) {
                    handleStream(data, botMsgEl);
                } else {
                    botMsgEl.innerHTML = renderMarkdown(data.answer || '未获取到答案');
                    botMsgEl.classList.add('rendered');
                    sendBtn.disabled = false;
                }
            } catch (err) {
                botMsgEl.textContent = '请求失败: ' + err.message;
                sendBtn.disabled = false;
            }
        }

        function handleStream(data, botMsgEl) {
            const { task_id } = data;
            const es = new EventSource(`${API_BASE}/stream/${task_id}`);
            let rawAnswerText = '';
            let progressBar = null;

            es.addEventListener('progress', (e) => {
                const d = JSON.parse(e.data || '{}');
                if (!progressBar) {
                    progressBar = appendProgressContainer(botMsgEl);
                }
                renderProgress(progressBar, d.done_list, d.running_list, d.status);
                if (d.status === 'completed') {
                    sendBtn.disabled = false;
                }
            });

            es.addEventListener('delta', (e) => {
                const d = JSON.parse(e.data || '{}');
                if (d.delta) {
                    rawAnswerText += d.delta;
                    botMsgEl.textContent = rawAnswerText;
                    scrollToBottom();
                }
            });

            es.addEventListener('final', (e) => {
                const d = JSON.parse(e.data || '{}');
                // 流式过程用纯文本累积，final 时整体渲染 Markdown（此时图片 URL 已完整）
                botMsgEl.innerHTML = renderMarkdown(d.answer || rawAnswerText || '未获取到答案');
                botMsgEl.classList.add('rendered');
                es.close();
                sendBtn.disabled = false;
                scrollToBottom();
            });

            es.onerror = () => {
                es.close();
                if (!rawAnswerText) {
                    botMsgEl.textContent = '连接中断';
                }
                sendBtn.disabled = false;
            };
        }

        async function loadHistory() {
            try {
                const resp = await fetch(`${API_BASE}/history/${sessionId}`);
                const data = await resp.json();
                if (data.items && data.items.length > 0) {
                    chatContainer.innerHTML = '';
                    data.items.forEach(item => {
                        appendMessage(item.role, item.text);
                    });
                }
            } catch (e) {
                console.warn('加载历史失败:', e);
            }
        }

        async function clearHistory() {
            if (!confirm('确定清空所有对话历史？')) return;
            try {
                await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
                chatContainer.innerHTML = '';
            } catch (e) {
                alert('清空失败: ' + e.message);
            }
        }
    </script>
</body>
</html>
